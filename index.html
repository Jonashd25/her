<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b2b20">
    <meta name="description" content="Eine kleine Überraschung, nur für dich.">
    <title>Für Ellis ♡</title>
    <style>


:root {
  --forest-950: #071c15;
  --forest-900: #0b2b20;
  --forest-800: #123d2e;
  --cream: #f6f0e4;
  --paper: #fffaf0;
  --gold: #d5b06b;
  --gold-dark: #9f7138;
  --ink: #183328;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--forest-950);
}

body {
  margin: 0;
  background: var(--forest-950);
  color: var(--cream);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  font: inherit;
}

.surprise-page {
  position: relative;
  min-height: 100svh;
  width: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  isolation: isolate;
  background:
    radial-gradient(circle at 50% 38%, rgba(67, 126, 95, 0.35), transparent 34%),
    radial-gradient(circle at 12% 8%, rgba(213, 176, 107, 0.09), transparent 25%),
    linear-gradient(145deg, var(--forest-800) 0%, var(--forest-900) 45%, var(--forest-950) 100%);
}

.surprise-page::before,
.surprise-page::after {
  position: fixed;
  z-index: -1;
  width: 48vw;
  height: 100vh;
  content: "";
  opacity: 0.25;
  filter: blur(1px);
  pointer-events: none;
}

.surprise-page::before {
  left: -14vw;
  bottom: -12vh;
  background:
    radial-gradient(ellipse at 20% 78%, transparent 0 39%, #02120d 40% 42%, transparent 43%),
    radial-gradient(ellipse at 50% 52%, transparent 0 38%, #061a12 39% 41%, transparent 42%),
    radial-gradient(ellipse at 75% 32%, transparent 0 37%, #051710 38% 41%, transparent 42%);
  transform: rotate(-11deg);
}

.surprise-page::after {
  right: -18vw;
  top: -15vh;
  background:
    radial-gradient(ellipse at 25% 58%, transparent 0 40%, #03150e 41% 43%, transparent 44%),
    radial-gradient(ellipse at 62% 38%, transparent 0 39%, #041a12 40% 42%, transparent 43%);
  transform: rotate(168deg);
}

.ambient {
  position: fixed;
  z-index: -2;
  border-radius: 999px;
  filter: blur(90px);
  pointer-events: none;
}

.ambient-one {
  top: 12%;
  left: 8%;
  width: 260px;
  height: 260px;
  background: rgba(207, 159, 102, 0.12);
}

.ambient-two {
  right: 4%;
  bottom: 5%;
  width: 360px;
  height: 360px;
  background: rgba(60, 133, 96, 0.17);
}

.grain {
  position: fixed;
  z-index: 20;
  inset: 0;
  opacity: 0.055;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
}

.fireflies {
  position: fixed;
  z-index: -1;
  inset: 0;
  pointer-events: none;
}

.fireflies span {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #f4d797;
  box-shadow: 0 0 9px 3px rgba(244, 215, 151, 0.5);
  animation: float-light 6s ease-in-out infinite;
}

.fireflies span:nth-child(1) { left: 9%; top: 18%; animation-delay: -1s; }
.fireflies span:nth-child(2) { left: 19%; top: 68%; animation-delay: -4s; }
.fireflies span:nth-child(3) { left: 31%; top: 24%; animation-delay: -2s; }
.fireflies span:nth-child(4) { left: 41%; top: 79%; animation-delay: -5s; }
.fireflies span:nth-child(5) { left: 54%; top: 13%; animation-delay: -3s; }
.fireflies span:nth-child(6) { left: 66%; top: 72%; animation-delay: -0.5s; }
.fireflies span:nth-child(7) { left: 75%; top: 28%; animation-delay: -4.5s; }
.fireflies span:nth-child(8) { left: 88%; top: 62%; animation-delay: -2.5s; }
.fireflies span:nth-child(9) { left: 95%; top: 12%; animation-delay: -1.5s; }
.fireflies span:nth-child(10) { left: 5%; top: 88%; animation-delay: -3.5s; }
.fireflies span:nth-child(11) { left: 58%; top: 91%; animation-delay: -2.2s; }
.fireflies span:nth-child(12) { left: 83%; top: 86%; animation-delay: -5.2s; }

.gift-scene {
  min-height: 100svh;
  padding: clamp(42px, 7vh, 86px) 24px 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  transition:
    opacity 0.45s ease,
    transform 0.55s ease,
    visibility 0.55s;
}

.stage-revealed .gift-scene {
  position: fixed;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transform: scale(1.08);
  pointer-events: none;
}

.intro-copy {
  position: relative;
  z-index: 2;
}

.eyebrow {
  margin: 0 0 14px;
  color: var(--gold);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.28em;
  line-height: 1;
  text-transform: uppercase;
}

.intro-copy h1,
.reveal-copy h2 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  letter-spacing: -0.045em;
  text-wrap: balance;
}

.intro-copy h1 {
  font-size: clamp(3.1rem, 8vw, 6.5rem);
  line-height: 0.94;
}

.intro-copy h1 span,
.reveal-copy h2 span {
  display: block;
  color: var(--gold);
  font-style: italic;
}

.intro-text {
  margin: 22px auto 0;
  color: rgba(246, 240, 228, 0.72);
  font-size: clamp(0.92rem, 2vw, 1.05rem);
  letter-spacing: 0.02em;
}

.gift-button {
  position: relative;
  width: 250px;
  height: 230px;
  margin: clamp(42px, 7vh, 72px) auto 16px;
  padding: 0;
  cursor: pointer;
  border: 0;
  outline: 0;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  animation: gift-breathe 2.8s ease-in-out infinite;
}

.gift-button:focus-visible {
  outline: 2px solid var(--cream);
  outline-offset: 12px;
  border-radius: 20px;
}

.gift-button:disabled {
  cursor: default;
}

.gift-shadow {
  position: absolute;
  left: 12%;
  bottom: 4px;
  width: 76%;
  height: 30px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  filter: blur(14px);
  transition: transform 0.5s ease;
}

.gift-box {
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 18px;
  height: 155px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 5px 5px 12px 12px;
  background:
    linear-gradient(112deg, rgba(255, 255, 255, 0.45), transparent 31%),
    linear-gradient(135deg, #f4e8d1, #d9c39e);
  box-shadow:
    inset -16px -14px 26px rgba(117, 77, 35, 0.13),
    0 22px 40px rgba(0, 0, 0, 0.2);
}

.gift-ribbon {
  position: absolute;
  display: block;
  background: linear-gradient(90deg, var(--gold-dark), #d9b36b 48%, #ad7b3d);
  box-shadow: inset 0 0 8px rgba(255, 240, 195, 0.28);
}

.gift-ribbon-vertical {
  top: 0;
  bottom: 0;
  left: calc(50% - 20px);
  width: 40px;
}

.gift-ribbon-horizontal {
  top: 63px;
  right: 0;
  left: 0;
  height: 31px;
}

.gift-lid {
  position: absolute;
  z-index: 4;
  top: 42px;
  left: 12px;
  width: 226px;
  height: 55px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 9px 9px 5px 5px;
  background:
    linear-gradient(110deg, rgba(255, 255, 255, 0.46), transparent 34%),
    linear-gradient(135deg, #fff4df, #ddc79f);
  box-shadow: 0 9px 18px rgba(0, 0, 0, 0.18);
  transform-origin: 88% 100%;
}

.lid-ribbon {
  position: absolute;
  top: 0;
  bottom: 0;
  left: calc(50% - 22px);
  width: 44px;
  background: linear-gradient(90deg, #a87134, #dfbd78 50%, #9c682e);
}

.bow {
  position: absolute;
  top: -39px;
  width: 62px;
  height: 45px;
  border: 10px solid #c6944c;
  background: rgba(213, 176, 107, 0.08);
  box-shadow: inset 0 0 9px rgba(255, 235, 181, 0.24);
}

.bow-left {
  left: 57px;
  border-radius: 60% 42% 50% 45%;
  transform: rotate(17deg);
}

.bow-right {
  right: 57px;
  border-radius: 42% 60% 45% 50%;
  transform: rotate(-17deg);
}

.bow-knot {
  position: absolute;
  z-index: 2;
  top: -17px;
  left: calc(50% - 15px);
  width: 30px;
  height: 25px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e0bc72, #a87337);
  box-shadow: 0 5px 10px rgba(0, 0, 0, 0.16);
}

.gift-tag {
  position: absolute;
  z-index: 6;
  top: 103px;
  right: 10px;
  width: 48px;
  height: 66px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(122, 88, 47, 0.18);
  border-radius: 4px 4px 16px 4px;
  color: var(--ink);
  background: #f5e7cb;
  box-shadow: 0 7px 13px rgba(0, 0, 0, 0.15);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.5rem;
  font-style: italic;
  transform: rotate(9deg);
}

.gift-tag::before {
  position: absolute;
  top: 6px;
  left: 7px;
  width: 6px;
  height: 6px;
  content: "";
  border-radius: 50%;
  background: var(--gold-dark);
}

.stage-opening .gift-button {
  animation: gift-pop 0.9s ease forwards;
}

.stage-opening .gift-lid {
  animation: open-lid 0.9s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
}

.stage-opening .gift-shadow {
  transform: scaleX(1.25);
}

.open-hint {
  min-height: 44px;
  padding: 10px 16px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  border: 0;
  border-radius: 999px;
  color: rgba(246, 240, 228, 0.76);
  background: transparent;
  font-size: 0.77rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  transition: color 0.2s ease;
}

.open-hint:hover {
  color: var(--cream);
}

.open-hint:focus-visible,
.reset-button:focus-visible,
.photo-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 5px;
}

.tap-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 0 rgba(213, 176, 107, 0.52);
  animation: tap-pulse 1.8s ease-out infinite;
}

.burst {
  position: fixed;
  z-index: 8;
  top: 53%;
  left: 50%;
  width: 10px;
  height: 10px;
  pointer-events: none;
  transform: translate(-50%, -50%);
}

.burst span {
  position: absolute;
  opacity: 0;
  color: #efd08b;
  font-size: 1.2rem;
}

.stage-opening .burst span {
  animation: burst-out 1s ease-out forwards;
}

.burst span:nth-child(1) { --x: -145px; --y: -105px; animation-delay: 0.03s; }
.burst span:nth-child(2) { --x: -66px; --y: -165px; animation-delay: 0.08s; }
.burst span:nth-child(3) { --x: 42px; --y: -172px; animation-delay: 0.12s; }
.burst span:nth-child(4) { --x: 145px; --y: -103px; animation-delay: 0.04s; }
.burst span:nth-child(5) { --x: 167px; --y: 10px; animation-delay: 0.14s; }
.burst span:nth-child(6) { --x: 90px; --y: 88px; animation-delay: 0.1s; }
.burst span:nth-child(7) { --x: -91px; --y: 91px; animation-delay: 0.17s; }
.burst span:nth-child(8) { --x: -168px; --y: 8px; animation-delay: 0.07s; }

.reveal-scene {
  width: min(1180px, 100%);
  min-height: 100svh;
  margin: 0 auto;
  padding: clamp(48px, 7vw, 90px) clamp(22px, 5vw, 68px) 100px;
  display: grid;
  grid-template-columns: minmax(280px, 0.8fr) minmax(500px, 1.2fr);
  grid-template-areas:
    "copy photos"
    "reset photos";
  column-gap: clamp(28px, 5vw, 76px);
  align-items: center;
  animation: reveal-in 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.reveal-copy {
  grid-area: copy;
  align-self: end;
}

.reveal-copy h2 {
  max-width: 520px;
  font-size: clamp(3rem, 5.7vw, 5.5rem);
  line-height: 0.98;
}

.reveal-copy > p:last-child {
  max-width: 420px;
  margin: 26px 0 0;
  color: rgba(246, 240, 228, 0.68);
  font-size: clamp(0.95rem, 1.8vw, 1.08rem);
  line-height: 1.75;
}

.photo-area {
  grid-area: photos;
  min-width: 0;
  text-align: center;
}

.photo-deck {
  position: relative;
  width: 100%;
  height: 560px;
  perspective: 1000px;
}

.photo-card {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(270px, 42%);
  margin: 0;
  padding: 10px 10px 42px;
  cursor: pointer;
  border: 0;
  border-radius: 2px;
  color: #2b2a25;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.92), transparent 55%),
    var(--paper);
  box-shadow:
    0 28px 58px rgba(0, 0, 0, 0.34),
    0 2px 5px rgba(0, 0, 0, 0.2);
  transform-origin: center;
  transition:
    transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
    filter 0.45s ease,
    box-shadow 0.45s ease;
  -webkit-tap-highlight-color: transparent;
}

.photo-card img {
  width: 100%;
  aspect-ratio: 9 / 16;
  display: block;
  object-fit: cover;
  background: #d5cfbf;
  filter: saturate(0.96) contrast(1.02);
}

.photo-caption {
  position: absolute;
  right: 8px;
  bottom: 13px;
  left: 8px;
  overflow: hidden;
  color: #5a5145;
  font-family: "Comic Sans MS", "Bradley Hand", cursive;
  font-size: 0.86rem;
  line-height: 1;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tape {
  position: absolute;
  top: -12px;
  left: 50%;
  width: 62px;
  height: 26px;
  opacity: 0.72;
  background: rgba(222, 201, 154, 0.72);
  transform: translateX(-50%) rotate(-2deg);
  clip-path: polygon(4% 7%, 97% 0, 92% 91%, 3% 100%);
}

.photo-1 {
  z-index: 1;
  transform: translate(-79%, -48%) rotate(-7deg) scale(0.94);
}

.photo-2 {
  z-index: 2;
  transform: translate(-24%, -50%) rotate(6deg) scale(0.94);
}

.photo-card:not(.is-active) {
  filter: brightness(0.86);
}

.photo-1.is-active {
  z-index: 4;
  transform: translate(-77%, -51%) rotate(-3deg) scale(1.04);
  filter: brightness(1);
  box-shadow:
    0 34px 70px rgba(0, 0, 0, 0.42),
    0 2px 5px rgba(0, 0, 0, 0.2);
}

.photo-2.is-active {
  z-index: 4;
  transform: translate(-25%, -51%) rotate(3deg) scale(1.04);
  filter: brightness(1);
  box-shadow:
    0 34px 70px rgba(0, 0, 0, 0.42),
    0 2px 5px rgba(0, 0, 0, 0.2);
}

.photo-hint {
  margin: -1px auto 0;
  color: rgba(246, 240, 228, 0.46);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  line-height: 1.5;
  text-transform: uppercase;
}

.reset-button {
  grid-area: reset;
  width: max-content;
  min-height: 48px;
  margin-top: 34px;
  padding: 0 19px;
  display: inline-flex;
  align-items: center;
  align-self: start;
  gap: 10px;
  cursor: pointer;
  border: 1px solid rgba(213, 176, 107, 0.34);
  border-radius: 999px;
  color: var(--cream);
  background: rgba(255, 255, 255, 0.045);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}

.reset-button:hover {
  border-color: rgba(213, 176, 107, 0.7);
  background: rgba(255, 255, 255, 0.08);
  transform: translateY(-2px);
}

.reset-button span {
  color: var(--gold);
  font-size: 1.2rem;
}

.screen-reader-status {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

footer {
  position: absolute;
  z-index: 10;
  right: 0;
  bottom: 22px;
  left: 0;
  color: rgba(246, 240, 228, 0.38);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 0.76rem;
  font-style: italic;
  letter-spacing: 0.08em;
  text-align: center;
  pointer-events: none;
}

@keyframes gift-breathe {
  0%, 100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-8px) rotate(0.4deg); }
}

@keyframes gift-pop {
  0% { transform: translateY(0) scale(1); }
  42% { transform: translateY(10px) scale(0.96); }
  72% { transform: translateY(-18px) scale(1.04); }
  100% { transform: translateY(-4px) scale(1); }
}

@keyframes open-lid {
  0% { transform: translate(0, 0) rotate(0); }
  55% { transform: translate(-20px, -80px) rotate(-18deg); }
  100% { transform: translate(82px, -110px) rotate(32deg); opacity: 0.28; }
}

@keyframes tap-pulse {
  0% { box-shadow: 0 0 0 0 rgba(213, 176, 107, 0.5); }
  70%, 100% { box-shadow: 0 0 0 9px rgba(213, 176, 107, 0); }
}

@keyframes float-light {
  0%, 100% { opacity: 0.2; transform: translate(0, 0) scale(0.8); }
  45% { opacity: 0.9; transform: translate(10px, -18px) scale(1.2); }
  70% { opacity: 0.45; transform: translate(-6px, -8px) scale(0.9); }
}

@keyframes burst-out {
  0% { opacity: 0; transform: translate(0, 0) scale(0.2) rotate(0); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.2) rotate(30deg); }
}

@keyframes reveal-in {
  from { opacity: 0; transform: translateY(24px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 850px) {
  .reveal-scene {
    grid-template-columns: 1fr;
    grid-template-areas:
      "copy"
      "photos"
      "reset";
    gap: 28px;
    padding-top: 56px;
    text-align: center;
  }

  .reveal-copy {
    align-self: center;
  }

  .reveal-copy h2,
  .reveal-copy > p:last-child {
    margin-right: auto;
    margin-left: auto;
  }

  .reveal-copy h2 {
    font-size: clamp(2.8rem, 9vw, 4.6rem);
  }

  .reveal-copy > p:last-child {
    margin-top: 18px;
  }

  .photo-area {
    width: min(560px, 100%);
    margin: 0 auto;
  }

  .photo-deck {
    height: min(520px, 102vw);
    min-height: 455px;
  }

  .photo-card {
    width: min(245px, 51vw);
  }

  .photo-1 {
    transform: translate(-84%, -48%) rotate(-7deg) scale(0.92);
  }

  .photo-2 {
    transform: translate(-16%, -48%) rotate(7deg) scale(0.92);
  }

  .photo-1.is-active {
    transform: translate(-73%, -51%) rotate(-3deg) scale(1.03);
  }

  .photo-2.is-active {
    transform: translate(-27%, -51%) rotate(3deg) scale(1.03);
  }

  .reset-button {
    justify-self: center;
    margin-top: 8px;
  }
}

@media (max-width: 520px) {
  .gift-scene {
    padding-top: 46px;
  }

  .gift-button {
    width: 230px;
    height: 220px;
    margin-top: 38px;
    transform: scale(0.92);
  }

  .gift-box {
    left: 14px;
    right: 14px;
  }

  .gift-lid {
    left: 2px;
  }

  .intro-copy h1 {
    font-size: clamp(3.2rem, 17vw, 5rem);
  }

  .reveal-scene {
    padding: 46px 16px 90px;
    gap: 21px;
  }

  .reveal-copy h2 {
    font-size: clamp(2.65rem, 13vw, 3.7rem);
  }

  .reveal-copy > p:last-child {
    max-width: 320px;
    font-size: 0.9rem;
    line-height: 1.55;
  }

  .photo-deck {
    height: 485px;
    min-height: 0;
  }

  .photo-card {
    width: min(235px, 64vw);
    padding: 8px 8px 38px;
  }

  .photo-1 {
    transform: translate(-67%, -48%) rotate(-7deg) scale(0.91);
  }

  .photo-2 {
    transform: translate(-33%, -48%) rotate(7deg) scale(0.91);
  }

    <script>
      (() => {
        const page = document.querySelector(".surprise-page");
        const giftScene = document.querySelector(".gift-scene");
        const revealScene = document.querySelector(".reveal-scene");
        const openButtons = [...document.querySelectorAll(".js-open-gift")];
        const photoButtons = [...document.querySelectorAll(".photo-card")];
        const resetButton = document.querySelector(".reset-button");
        const statusNode = document.querySelector(".screen-reader-status");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let revealTimer;

        const setStage = (stage) => {
          page.classList.remove("stage-closed", "stage-opening", "stage-revealed");
          page.classList.add(`stage-${stage}`);
        };

        const selectPhoto = (selected) => {
          photoButtons.forEach((button, index) => {
            const active = index === selected;
            button.classList.toggle("is-active", active);
            button.setAttribute("aria-pressed", String(active));
          });
        };

        const openGift = () => {
          if (!page.classList.contains("stage-closed")) return;

          setStage("opening");
          openButtons.forEach((button) => {
            button.disabled = true;
          });
          statusNode.textContent = "Das Geschenk wird geöffnet.";

          revealTimer = window.setTimeout(() => {
            revealScene.hidden = false;
            giftScene.setAttribute("aria-hidden", "true");
            setStage("revealed");
            statusNode.textContent =
              "Das Geschenk ist geöffnet. Zwei Bilder sind sichtbar.";
          }, reducedMotion ? 20 : 900);
        };

        const resetGift = () => {
          window.clearTimeout(revealTimer);
          revealScene.hidden = true;
          giftScene.setAttribute("aria-hidden", "false");
          selectPhoto(0);
          setStage("closed");
          openButtons.forEach((button) => {
            button.disabled = false;
          });
          statusNode.textContent = "";
          window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
        };

        openButtons.forEach((button) => button.addEventListener("click", openGift));
        photoButtons.forEach((button, index) =>
          button.addEventListener("click", () => selectPhoto(index))
        );
        resetButton.addEventListener("click", resetGift);
      })();
    </script>
