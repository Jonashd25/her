<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b2b20">
    <meta name="description" content="Eine kleine Überraschung, nur für Ellis.">
    <title>Für Ellis ♡</title>
    <style>
      :root {
        --forest-950: #061812;
        --forest-900: #0a291f;
        --forest-800: #123d2e;
        --forest-700: #1a503c;
        --cream: #f7f0e3;
        --paper: #fffaf0;
        --gold: #d8b36f;
        --gold-dark: #9f7138;
        --ink: #173126;
      }

      * { box-sizing: border-box; }

      html {
        background: var(--forest-950);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--cream);
        background: var(--forest-950);
        font-family: Arial, Helvetica, sans-serif;
      }

      button { font: inherit; }
      [hidden] { display: none !important; }

      .page {
        position: relative;
        min-height: 100svh;
        overflow-x: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 35%, rgba(76, 139, 105, .32), transparent 35%),
          radial-gradient(circle at 10% 8%, rgba(216, 179, 111, .1), transparent 24%),
          linear-gradient(145deg, var(--forest-800), var(--forest-900) 46%, var(--forest-950));
      }

      .page::before,
      .page::after {
        position: fixed;
        z-index: -2;
        width: 52vw;
        height: 110vh;
        content: "";
        opacity: .25;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 25% 70%, transparent 0 39%, #02110c 40% 42%, transparent 43%),
          radial-gradient(ellipse at 65% 42%, transparent 0 38%, #041910 39% 41%, transparent 42%);
      }

      .page::before {
        left: -18vw;
        bottom: -18vh;
        transform: rotate(-12deg);
      }

      .page::after {
        right: -19vw;
        top: -18vh;
        transform: rotate(168deg);
      }

      .grain {
        position: fixed;
        z-index: 50;
        inset: 0;
        opacity: .045;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
      }

      .fireflies {
        position: fixed;
        z-index: -1;
        inset: 0;
        pointer-events: none;
      }

      .fireflies span {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #f3d58f;
        box-shadow: 0 0 10px 3px rgba(243, 213, 143, .46);
        animation: float-light 6s ease-in-out infinite;
      }

      .fireflies span:nth-child(1) { left: 8%; top: 17%; animation-delay: -1s; }
      .fireflies span:nth-child(2) { left: 18%; top: 73%; animation-delay: -4s; }
      .fireflies span:nth-child(3) { left: 31%; top: 29%; animation-delay: -2s; }
      .fireflies span:nth-child(4) { left: 43%; top: 84%; animation-delay: -5s; }
      .fireflies span:nth-child(5) { left: 56%; top: 12%; animation-delay: -3s; }
      .fireflies span:nth-child(6) { left: 67%; top: 70%; animation-delay: -.5s; }
      .fireflies span:nth-child(7) { left: 76%; top: 25%; animation-delay: -4.5s; }
      .fireflies span:nth-child(8) { left: 89%; top: 62%; animation-delay: -2.5s; }
      .fireflies span:nth-child(9) { left: 94%; top: 11%; animation-delay: -1.5s; }
      .fireflies span:nth-child(10) { left: 5%; top: 91%; animation-delay: -3.5s; }
      .fireflies span:nth-child(11) { left: 59%; top: 93%; animation-delay: -2.2s; }
      .fireflies span:nth-child(12) { left: 84%; top: 88%; animation-delay: -5.2s; }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--gold);
        font-size: .72rem;
        font-weight: 700;
        letter-spacing: .28em;
        line-height: 1;
        text-transform: uppercase;
      }

      .gift-view {
        min-height: 100svh;
        padding: clamp(42px, 7vh, 86px) 24px 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        transition: opacity .45s ease, transform .55s ease, visibility .55s;
      }

      .stage-revealed .gift-view {
        position: fixed;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        transform: scale(1.08);
        pointer-events: none;
      }

      .intro-copy { position: relative; z-index: 2; }

      .intro-copy h1,
      .album-copy h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        letter-spacing: -.045em;
        text-wrap: balance;
      }

      .intro-copy h1 {
        font-size: clamp(3.2rem, 8vw, 6.5rem);
        line-height: .94;
      }

      .intro-copy h1 span,
      .album-copy h2 span {
        display: block;
        color: var(--gold);
        font-style: italic;
      }

      .intro-copy > p:last-child {
        margin: 22px auto 0;
        color: rgba(247, 240, 227, .7);
        font-size: clamp(.92rem, 2vw, 1.05rem);
      }

      .gift-button {
        position: relative;
        width: 250px;
        height: 230px;
        margin: clamp(42px, 7vh, 72px) auto 14px;
        padding: 0;
        cursor: pointer;
        border: 0;
        background: transparent;
        -webkit-tap-highlight-color: transparent;
        animation: gift-breathe 2.8s ease-in-out infinite;
      }

      .gift-button:focus-visible,
      .open-hint:focus-visible,
      .nav-button:focus-visible,
      .thumb:focus-visible,
      .reset-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 5px;
      }

      .gift-shadow {
        position: absolute;
        left: 12%;
        bottom: 4px;
        width: 76%;
        height: 30px;
        border-radius: 50%;
        background: rgba(0, 0, 0, .3);
        filter: blur(14px);
      }

      .gift-box {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 18px;
        height: 155px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .35);
        border-radius: 5px 5px 12px 12px;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, .45), transparent 31%),
          linear-gradient(135deg, #f4e8d1, #d9c39e);
        box-shadow: inset -16px -14px 26px rgba(117, 77, 35, .13), 0 22px 40px rgba(0, 0, 0, .2);
      }

      .ribbon-v,
      .ribbon-h {
        position: absolute;
        display: block;
        background: linear-gradient(90deg, var(--gold-dark), #d9b36b 48%, #ad7b3d);
      }

      .ribbon-v { top: 0; bottom: 0; left: calc(50% - 20px); width: 40px; }
      .ribbon-h { top: 63px; right: 0; left: 0; height: 31px; }

      .gift-lid {
        position: absolute;
        z-index: 4;
        top: 42px;
        left: 12px;
        width: 226px;
        height: 55px;
        border: 1px solid rgba(255, 255, 255, .4);
        border-radius: 9px 9px 5px 5px;
        background:
          linear-gradient(110deg, rgba(255, 255, 255, .46), transparent 34%),
          linear-gradient(135deg, #fff4df, #ddc79f);
        box-shadow: 0 9px 18px rgba(0, 0, 0, .18);
        transform-origin: 88% 100%;
      }

      .gift-lid::before {
        position: absolute;
        top: 0;
        bottom: 0;
        left: calc(50% - 22px);
        width: 44px;
        content: "";
        background: linear-gradient(90deg, #a87134, #dfbd78 50%, #9c682e);
      }

      .bow {
        position: absolute;
        top: -39px;
        width: 62px;
        height: 45px;
        border: 10px solid #c6944c;
        background: rgba(213, 176, 107, .08);
      }

      .bow-left {
        left: 57px;
        border-radius: 60% 42% 50% 45%;
        transform: rotate(17deg);
      }

      .bow-right {
        right: 57px;
        border-radius: 42% 60% 45% 50%;
        transform: rotate(-17deg);
      }

      .bow-knot {
        position: absolute;
        z-index: 2;
        top: -17px;
        left: calc(50% - 15px);
        width: 30px;
        height: 25px;
        border-radius: 50%;
        background: linear-gradient(135deg, #e0bc72, #a87337);
      }

      .gift-tag {
        position: absolute;
        z-index: 6;
        top: 103px;
        right: 10px;
        width: 48px;
        height: 66px;
        display: grid;
        place-items: center;
        border-radius: 4px 4px 16px 4px;
        color: var(--ink);
        background: #f5e7cb;
        box-shadow: 0 7px 13px rgba(0, 0, 0, .15);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        font-style: italic;
        transform: rotate(9deg);
      }

      .stage-opening .gift-button { animation: gift-pop .9s ease forwards; }
      .stage-opening .gift-lid { animation: open-lid .9s cubic-bezier(.17, .89, .32, 1.28) forwards; }

      .open-hint {
        min-height: 44px;
        padding: 10px 16px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        border: 0;
        border-radius: 999px;
        color: rgba(247, 240, 227, .76);
        background: transparent;
        font-size: .77rem;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .tap-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        animation: tap-pulse 1.8s ease-out infinite;
      }

      .burst {
        position: fixed;
        z-index: 8;
        top: 53%;
        left: 50%;
        width: 10px;
        height: 10px;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .burst span {
        position: absolute;
        opacity: 0;
        color: #efd08b;
        font-size: 1.2rem;
      }

      .stage-opening .burst span { animation: burst-out 1s ease-out forwards; }
      .burst span:nth-child(1) { --x: -145px; --y: -105px; }
      .burst span:nth-child(2) { --x: -66px; --y: -165px; animation-delay: .08s; }
      .burst span:nth-child(3) { --x: 42px; --y: -172px; animation-delay: .12s; }
      .burst span:nth-child(4) { --x: 145px; --y: -103px; animation-delay: .04s; }
      .burst span:nth-child(5) { --x: 167px; --y: 10px; animation-delay: .14s; }
      .burst span:nth-child(6) { --x: 90px; --y: 88px; animation-delay: .1s; }
      .burst span:nth-child(7) { --x: -91px; --y: 91px; animation-delay: .17s; }
      .burst span:nth-child(8) { --x: -168px; --y: 8px; animation-delay: .07s; }

      .album {
        width: min(1240px, 100%);
        min-height: 100svh;
        margin: 0 auto;
        padding: clamp(48px, 6vw, 84px) clamp(20px, 5vw, 68px) 92px;
        display: grid;
        grid-template-columns: minmax(275px, .72fr) minmax(500px, 1.28fr);
        grid-template-areas:
          "copy viewer"
          "film film"
          "reset reset";
        column-gap: clamp(30px, 6vw, 82px);
        row-gap: 26px;
        align-items: center;
        animation: album-in .8s cubic-bezier(.22, 1, .36, 1) both;
      }

      .album-copy { grid-area: copy; }

      .album-copy h2 {
        font-size: clamp(3.1rem, 5.9vw, 5.8rem);
        line-height: .96;
      }

      .album-copy > p:last-of-type {
        max-width: 410px;
        margin: 24px 0 0;
        color: rgba(247, 240, 227, .68);
        font-size: 1rem;
        line-height: 1.7;
      }

      .album-controls {
        margin-top: 34px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .nav-button {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        cursor: pointer;
        border: 1px solid rgba(216, 179, 111, .38);
        border-radius: 50%;
        color: var(--cream);
        background: rgba(255, 255, 255, .045);
        font-size: 1.35rem;
        transition: transform .2s ease, background .2s ease, border-color .2s ease;
      }

      .nav-button:hover {
        border-color: var(--gold);
        background: rgba(255, 255, 255, .09);
        transform: translateY(-2px);
      }

      .count {
        min-width: 78px;
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        font-style: italic;
        text-align: center;
      }

      .viewer {
        grid-area: viewer;
        min-width: 0;
        text-align: center;
        touch-action: pan-y;
      }

      .stack {
        position: relative;
        width: min(500px, 100%);
        margin: 0 auto;
        perspective: 1200px;
      }

      .ghost-card {
        position: absolute;
        inset: 18px 22px -4px;
        border-radius: 3px;
        background: #e6dcc8;
        box-shadow: 0 24px 45px rgba(0, 0, 0, .22);
      }

      .ghost-one { transform: rotate(-5deg) translate(-18px, 5px); opacity: .5; }
      .ghost-two { transform: rotate(4deg) translate(18px, 2px); opacity: .75; }

      .polaroid {
        position: relative;
        z-index: 3;
        margin: 0;
        padding: 12px 12px 16px;
        border-radius: 3px;
        color: #403b32;
        background: var(--paper);
        box-shadow: 0 34px 76px rgba(0, 0, 0, .42);
        transform: rotate(-1deg);
        transition: opacity .18s ease, transform .22s ease;
      }

      .polaroid.swapping {
        opacity: .25;
        transform: translateY(10px) rotate(1deg) scale(.98);
      }

      .photo-window {
        position: relative;
        width: 100%;
        height: min(61vh, 590px);
        min-height: 390px;
        overflow: hidden;
        background: #c5bba8;
      }

      .photo-backdrop {
        position: absolute;
        inset: -28px;
        opacity: .4;
        background-position: center;
        background-size: cover;
        filter: blur(24px) saturate(.8) brightness(.7);
        transform: scale(1.1);
        transition: background-image .2s ease;
      }

      .album-image {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        opacity: 1;
        user-select: none;
        -webkit-user-drag: none;
      }

      .loader {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        width: 36px;
        height: 36px;
        display: none;
        border: 3px solid rgba(255, 255, 255, .3);
        border-top-color: var(--cream);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        animation: spin .8s linear infinite;
      }

      .photo-window.loading .loader { display: block; }
      .photo-window.loading .album-image { opacity: .25; }

      .polaroid figcaption {
        min-height: 46px;
        padding: 14px 7px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .caption {
        overflow: hidden;
        font-family: "Comic Sans MS", "Bradley Hand", cursive;
        font-size: .92rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .photo-number {
        flex: 0 0 auto;
        color: #8d7d63;
        font-size: .68rem;
        font-weight: 700;
        letter-spacing: .12em;
      }

      .swipe-hint {
        margin: 21px 0 0;
        color: rgba(247, 240, 227, .42);
        font-size: .67rem;
        font-weight: 700;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .filmstrip {
        grid-area: film;
        width: 100%;
        padding: 12px 3px 16px;
        display: flex;
        gap: 10px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scrollbar-width: thin;
        scrollbar-color: rgba(216, 179, 111, .45) transparent;
        scroll-snap-type: x proximity;
      }

      .thumb {
        position: relative;
        flex: 0 0 70px;
        width: 70px;
        height: 82px;
        padding: 4px;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 4px;
        background: rgba(255, 255, 255, .06);
        opacity: .55;
        scroll-snap-align: center;
        transition: opacity .2s ease, transform .2s ease, border-color .2s ease;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 2px;
      }

      .thumb:hover,
      .thumb.is-active {
        opacity: 1;
        border-color: var(--gold);
        transform: translateY(-3px);
      }

      .thumb.is-active::after {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 7px;
        height: 7px;
        content: "";
        border: 2px solid var(--paper);
        border-radius: 50%;
        background: var(--gold);
      }

      .reset-button {
        grid-area: reset;
        justify-self: center;
        min-height: 48px;
        padding: 0 19px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        border: 1px solid rgba(216, 179, 111, .34);
        border-radius: 999px;
        color: var(--cream);
        background: rgba(255, 255, 255, .045);
        font-size: .74rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .reset-button span { color: var(--gold); font-size: 1.2rem; }

      .sr-status {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .love-note {
        position: absolute;
        right: 0;
        bottom: 22px;
        left: 0;
        color: rgba(247, 240, 227, .36);
        font-family: Georgia, "Times New Roman", serif;
        font-size: .76rem;
        font-style: italic;
        letter-spacing: .08em;
        text-align: center;
        pointer-events: none;
      }

      @keyframes gift-breathe {
        0%, 100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-8px) rotate(.4deg); }
      }

      @keyframes gift-pop {
        0% { transform: translateY(0) scale(1); }
        42% { transform: translateY(10px) scale(.96); }
        72% { transform: translateY(-18px) scale(1.04); }
        100% { transform: translateY(-4px) scale(1); }
      }

      @keyframes open-lid {
        0% { transform: translate(0, 0) rotate(0); }
        55% { transform: translate(-20px, -80px) rotate(-18deg); }
        100% { transform: translate(82px, -110px) rotate(32deg); opacity: .28; }
      }

      @keyframes tap-pulse {
        0% { box-shadow: 0 0 0 0 rgba(216, 179, 111, .5); }
        70%, 100% { box-shadow: 0 0 0 9px rgba(216, 179, 111, 0); }
      }

      @keyframes float-light {
        0%, 100% { opacity: .2; transform: translate(0, 0) scale(.8); }
        45% { opacity: .9; transform: translate(10px, -18px) scale(1.2); }
        70% { opacity: .45; transform: translate(-6px, -8px) scale(.9); }
      }

      @keyframes burst-out {
        0% { opacity: 0; transform: translate(0, 0) scale(.2); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.2) rotate(30deg); }
      }

      @keyframes album-in {
        from { opacity: 0; transform: translateY(25px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      @media (max-width: 850px) {
        .album {
          grid-template-columns: 1fr;
          grid-template-areas:
            "copy"
            "viewer"
            "film"
            "reset";
          gap: 25px;
          padding-top: 54px;
          text-align: center;
        }

        .album-copy h2 { font-size: clamp(2.9rem, 11vw, 4.8rem); }
        .album-copy > p:last-of-type { margin-right: auto; margin-left: auto; }
        .album-controls { justify-content: center; margin-top: 24px; }
        .stack { width: min(470px, 92vw); }
        .photo-window { height: min(62vh, 570px); min-height: 390px; }
        .filmstrip { margin-top: -4px; }
      }

      @media (max-width: 520px) {
        .gift-button { transform: scale(.92); margin-top: 38px; }
        .intro-copy h1 { font-size: clamp(3.2rem, 17vw, 5rem); }

        .album {
          padding: 44px 14px 92px;
          gap: 20px;
        }

        .album-copy h2 { font-size: clamp(2.65rem, 13vw, 3.8rem); }
        .album-copy > p:last-of-type { margin-top: 17px; font-size: .9rem; line-height: 1.55; }
        .album-controls { margin-top: 20px; }
        .nav-button { width: 48px; height: 48px; }

        .stack { width: min(365px, 91vw); }
        .polaroid { padding: 8px 8px 12px; }
        .photo-window { height: min(57vh, 490px); min-height: 350px; }
        .polaroid figcaption { min-height: 42px; padding: 12px 5px 0; }
        .caption { font-size: .82rem; }
        .thumb { flex-basis: 62px; width: 62px; height: 73px; }
        .swipe-hint { margin-top: 18px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page stage-closed">
      <div class="grain" aria-hidden="true"></div>
      <div class="fireflies" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <section class="gift-view" aria-hidden="false">
        <div class="intro-copy">
          <p class="eyebrow">Nur für dich</p>
          <h1>Für dich,<span> Ellis.</span></h1>
          <p>Ich habe dir etwas Kleines eingepackt.</p>
        </div>

        <button class="gift-button js-open" type="button" aria-label="Geschenk öffnen">
          <span class="gift-shadow" aria-hidden="true"></span>
          <span class="gift-box" aria-hidden="true">
            <span class="ribbon-h"></span>
            <span class="ribbon-v"></span>
          </span>
          <span class="gift-lid" aria-hidden="true">
            <span class="bow bow-left"></span>
            <span class="bow bow-right"></span>
            <span class="bow-knot"></span>
          </span>
          <span class="gift-tag" aria-hidden="true">E</span>
        </button>

        <button class="open-hint js-open" type="button">
          <span class="tap-dot" aria-hidden="true"></span>
          Geschenk antippen
        </button>

      <div class="burst" aria-hidden="true">
        <span>♥</span><span>✦</span><span>♥</span><span>✧</span>
        <span>♥</span><span>✦</span><span>♥</span><span>✧</span>
      </div>

      <section class="album" aria-label="Unser kleines Fotoalbum" hidden>
        <header class="album-copy">
          <p class="eyebrow">Unser kleines Album</p>
          <h2>Momente, die<span> bleiben.</span></h2>
          <p>Ein bisschen Abenteuer, ganz viel Chaos und ziemlich viele gute Erinnerungen.</p>

          <div class="album-controls" aria-label="Albumsteuerung">
            <button class="nav-button previous" type="button" aria-label="Vorheriges Bild">←</button>
            <span class="count" aria-live="polite">01 / 12</span>
            <button class="nav-button next" type="button" aria-label="Nächstes Bild">→</button>
          </div>
        </header>

        <div class="viewer">
          <div class="stack">
            <div class="ghost-card ghost-one" aria-hidden="true"></div>
            <div class="ghost-card ghost-two" aria-hidden="true"></div>
            <figure class="polaroid">
              <div class="photo-window loading">
                <div class="photo-backdrop" aria-hidden="true"></div>
                <img class="album-image" alt="" draggable="false">
                <span class="loader" aria-hidden="true"></span>
              </div>
              <figcaption>
                <span class="caption">kleiner chaosmoment</span>
                <span class="photo-number">MOMENT 01</span>
              </figcaption>
            </figure>
          </div>
          <p class="swipe-hint">Wischen oder Pfeile benutzen</p>
        </div>

        <nav class="filmstrip" aria-label="Alle Bilder"></nav>

        <button class="reset-button" type="button">
          <span aria-hidden="true">↻</span>
          Geschenk nochmals öffnen
        </button>
      </section>

      <p class="sr-status" aria-live="polite"></p>
      <p class="love-note">mit ganz viel ♡</p>
    </main>

    <script>
      (() => {
        const photos = [{"file":"assets/01.b64","alt":"Ellis unter violett-rotem Licht","label":"kleiner chaosmoment"},{"file":"assets/02.b64","alt":"Ellis auf einem roten Handy-Motiv","label":"einfach ikonisch"},{"file":"assets/03.b64","alt":"Eine neugierige Kuh auf einer Alp","label":"muuuh."},{"file":"assets/04.b64","alt":"Ellis beim Reiten","label":"ellis in ihrem element"},{"file":"assets/05.b64","alt":"Gemeinsam mit einem Pferd unterwegs","label":"zusammen unterwegs"},{"file":"assets/06.b64","alt":"Ellis unter einem blauen Himmel","label":"himmel & du"},{"file":"assets/07.b64","alt":"Jonas und Ellis bei den Kühen","label":"wir zwei"},{"file":"assets/08.b64","alt":"Jonas und Ellis während einer Fahrt","label":"lange fahrten"},{"file":"assets/09.b64","alt":"Jonas und Ellis in warmem Licht","label":"kuscheliges chaos"},{"file":"assets/10.b64","alt":"Ein lustiges Mehrfachbild von Ellis","label":"ein bisschen zu viel ellis"},{"file":"assets/11.b64","alt":"Jonas und Ellis mit Cortisol-Spike-Filter","label":"cortisol spike"},{"file":"assets/12.b64","alt":"Ellis mit einem lustigen Glatzenfilter","label":"neue frisur?"}];
        const cache = new Map();
        const page = document.querySelector(".page");
        const giftView = document.querySelector(".gift-view");
        const album = document.querySelector(".album");
        const openButtons = Array.from(document.querySelectorAll(".js-open"));
        const previousButton = document.querySelector(".previous");
        const nextButton = document.querySelector(".next");
        const resetButton = document.querySelector(".reset-button");
        const filmstrip = document.querySelector(".filmstrip");
        const viewer = document.querySelector(".viewer");
        const polaroid = document.querySelector(".polaroid");
        const photoWindow = document.querySelector(".photo-window");
        const albumImage = document.querySelector(".album-image");
        const backdrop = document.querySelector(".photo-backdrop");
        const caption = document.querySelector(".caption");
        const photoNumber = document.querySelector(".photo-number");
        const count = document.querySelector(".count");
        const statusNode = document.querySelector(".sr-status");
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let currentIndex = 0;
        let revealTimer;
        let renderToken = 0;
        let pointerStart = null;

        const pad = (value) => String(value).padStart(2, "0");

        const setStage = (stage) => {
          page.classList.remove("stage-closed", "stage-opening", "stage-revealed");
          page.classList.add("stage-" + stage);
        };

        const getSource = async (photo) => {
          if (cache.has(photo.file)) return cache.get(photo.file);
          const response = await fetch(photo.file);
          if (!response.ok) throw new Error("Bild konnte nicht geladen werden");
          const encoded = (await response.text()).trim();
          const source = "data:image/jpeg;base64," + encoded;
          cache.set(photo.file, source);
          return source;
        };

        const updateActiveThumb = () => {
          const thumbs = Array.from(filmstrip.querySelectorAll(".thumb"));
          thumbs.forEach((thumb, index) => {
            const active = index === currentIndex;
            thumb.classList.toggle("is-active", active);
            thumb.setAttribute("aria-current", active ? "true" : "false");
          });
          const activeThumb = thumbs[currentIndex];
          if (activeThumb) {
            activeThumb.scrollIntoView({
              behavior: reducedMotion ? "auto" : "smooth",
              block: "nearest",
              inline: "center"
            });
          }
        };

        const renderPhoto = async (index, animate = true) => {
          const token = ++renderToken;
          currentIndex = (index + photos.length) % photos.length;
          const photo = photos[currentIndex];

          if (animate) polaroid.classList.add("swapping");
          photoWindow.classList.add("loading");
          count.textContent = pad(currentIndex + 1) + " / " + pad(photos.length);
          photoNumber.textContent = "MOMENT " + pad(currentIndex + 1);
          caption.textContent = photo.label;
          updateActiveThumb();

          try {
            const source = await getSource(photo);
            if (token !== renderToken) return;

            window.setTimeout(() => {
              if (token !== renderToken) return;
              albumImage.src = source;
              albumImage.alt = photo.alt;
              backdrop.style.backgroundImage = 'url("' + source + '")';
              photoWindow.classList.remove("loading");
              polaroid.classList.remove("swapping");
              statusNode.textContent =
                "Bild " + (currentIndex + 1) + " von " + photos.length + ": " + photo.label;
            }, animate && !reducedMotion ? 130 : 0);

            const nextPhoto = photos[(currentIndex + 1) % photos.length];
            getSource(nextPhoto).catch(() => {});
          } catch {
            photoWindow.classList.remove("loading");
            polaroid.classList.remove("swapping");
            caption.textContent = "Bild konnte nicht geladen werden";
          }
        };

        const createFilmstrip = () => {
          photos.forEach((photo, index) => {
            const button = document.createElement("button");
            const image = document.createElement("img");
            button.type = "button";
            button.className = "thumb";
            button.setAttribute("aria-label", "Moment " + pad(index + 1) + " anzeigen");
            image.alt = "";
            image.loading = "lazy";
            button.appendChild(image);
            button.addEventListener("click", () => renderPhoto(index));
            filmstrip.appendChild(button);
            getSource(photo).then((source) => { image.src = source; }).catch(() => {});
          });
        };

        const openGift = () => {
          if (!page.classList.contains("stage-closed")) return;
          setStage("opening");
          openButtons.forEach((button) => { button.disabled = true; });
          statusNode.textContent = "Das Geschenk wird geöffnet.";

          revealTimer = window.setTimeout(() => {
            album.hidden = false;
            giftView.setAttribute("aria-hidden", "true");
            setStage("revealed");
            renderPhoto(0, false);
          }, reducedMotion ? 20 : 900);
        };

        const resetGift = () => {
          window.clearTimeout(revealTimer);
          album.hidden = true;
          giftView.setAttribute("aria-hidden", "false");
          setStage("closed");
          currentIndex = 0;
          openButtons.forEach((button) => { button.disabled = false; });
          statusNode.textContent = "";
          window.scrollTo({ top: 0, behavior: reducedMotion ? "auto" : "smooth" });
        };

        openButtons.forEach((button) => button.addEventListener("click", openGift));
        previousButton.addEventListener("click", () => renderPhoto(currentIndex - 1));
        nextButton.addEventListener("click", () => renderPhoto(currentIndex + 1));
        resetButton.addEventListener("click", resetGift);

        viewer.addEventListener("pointerdown", (event) => {
          pointerStart = event.clientX;
        });

        viewer.addEventListener("pointerup", (event) => {
          if (pointerStart === null) return;
          const distance = event.clientX - pointerStart;
          pointerStart = null;
          if (Math.abs(distance) < 45) return;
          renderPhoto(currentIndex + (distance < 0 ? 1 : -1));
        });

        viewer.addEventListener("pointercancel", () => { pointerStart = null; });

        document.addEventListener("keydown", (event) => {
          if (!page.classList.contains("stage-revealed")) return;
          if (event.key === "ArrowLeft") renderPhoto(currentIndex - 1);
          if (event.key === "ArrowRight") renderPhoto(currentIndex + 1);
        });

        createFilmstrip();
        renderPhoto(0, false);
      })();
    </script>
  </body>
</html>
